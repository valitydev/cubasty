name: Build and publish Docker image

on:
  push:
    branches:
      - 'master'
      - 'epic/**'
  pull_request:
    branches: ['**']

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Same event-based defaults as valitydev/action-deploy-docker@v2, plus a
  # per-platform matrix: platforms with a native runner build there, anything
  # else falls back to QEMU on ubuntu-latest.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.config.outputs.push }}
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - name: 🎲 Configure build
        id: config
        env:
          RUNNERS: '{"linux/amd64":"ubuntu-latest","linux/arm64":"ubuntu-24.04-arm"}'
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "[INFO] Push event: publish a multiplatform image."
            push=true
            platforms=linux/amd64,linux/arm64
          else
            echo "[INFO] PR event: just build an image under native platform."
            push=false
            platforms=linux/amd64
          fi
          matrix=$(jq -nc --arg p "$platforms" --argjson r "$RUNNERS" \
            '[$p | split(",")[] | {platform: ., runner: ($r[.] // "ubuntu-latest"), emulate: ($r[.] == null)}]')
          echo "[INFO] push=$push matrix=$matrix"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 🖨 Checkout code
        uses: actions/checkout@v4

      - name: 💉 Set up buildargs
        run: |
          if [[ -f ".env" ]]; then
            echo 'BUILDARGS<<EOF' >> "$GITHUB_ENV"
            grep -v '^#' .env >> "$GITHUB_ENV"
            echo 'EOF' >> "$GITHUB_ENV"
          else
            echo "[NOTICE] No '.env' file to source buildargs from!"
          fi
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: 🏗 Set up QEMU
        if: ${{ matrix.emulate }}
        uses: docker/setup-qemu-action@v3

      - name: 🏗 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔓 Log in to the Container registry
        if: ${{ needs.prepare.outputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ℹ️ Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest only; tags are attached to the manifest list in `merge`.
      - name: 🚀 Build (and push by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ env.BUILDARGS }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ needs.prepare.outputs.push }}

      - name: 📦 Export digest
        if: ${{ needs.prepare.outputs.push == 'true' }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: 📦 Upload digest
        if: ${{ needs.prepare.outputs.push == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.push == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: 🏗 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔓 Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ℹ️ Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,enable=${{ !startsWith(github.ref_name, 'epic') }}
            type=raw,value=sha-{{ sha }}-{{ branch }},enable=${{ startsWith(github.ref_name, 'epic') }}

      - name: 🚀 Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: 🔍 Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
